name: Deploy Terraform

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::905418049972:role/ec2TerraformExecutionRole-production
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: terraform init
      

      - name: Diagnose AWS and Terraform
        working-directory: terraform
        run: |
          set +e

          echo "===== AWS Identity ====="
          aws sts get-caller-identity

          echo "=== Bucket location ==="
          aws s3api get-bucket-location \
          --bucket example-bucket-karthitest1987

          echo "=== Bucket policy ==="
          aws s3api get-bucket-policy \
            --bucket example-bucket-karthitest1987 \
            --query Policy \
            --output text


          echo "===== Terraform Version ====="
          terraform version

          echo "===== Provider Versions ====="
          terraform providers

          echo "===== Workspace ====="
          terraform workspace show

          echo "===== Terraform State ====="
          terraform state list

          echo "===== S3 Bucket Check ====="
          aws s3api head-bucket \
            --bucket example-bucket-karthitest1987 \
            --region us-east-1
          echo "head-bucket exit code: $?"

          echo "===== Bucket Location ====="
          aws s3api get-bucket-location \
            --bucket example-bucket-karthitest1987
          echo "get-bucket-location exit code: $?"

          echo "===== Resource State ====="
          terraform state show aws_s3_bucket.example
          echo "state-show exit code: $?"

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -no-color

      - name: Terraform apply
        working-directory: terraform
        timeout-minutes: 5
        env:
          TF_LOG: DEBUG
          TF_LOG_PATH: ${{ runner.temp }}/terraform-debug.log
        run: terraform apply -auto-approve -no-color

      - name: Upload Terraform debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-debug-log
          path: ${{ runner.temp }}/terraform-debug.log
          if-no-files-found: warn
          retention-days: 3
