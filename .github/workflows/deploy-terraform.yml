name: Deploy Terraform

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write      # Required for OIDC
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Authenticate directly to AWS using TerraformExecutionRole via OIDC
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::905418049972:role/ec2TerraformExecutionRole-production
          aws-region: us-east-1

      # 3️⃣ Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4️⃣ Terraform Init (uses backend.tf automatically)
      - name: Terraform init
        working-directory: terraform
        run: terraform init

      # 5️⃣ Terraform Plan
      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan

      - name: Diagnose Terraform state and AWS identity
        working-directory: terraform
        run: |
          aws sts get-caller-identity
          terraform workspace show
          terraform state list
          terraform state show aws_s3_bucket.example
          terraform plan -refresh=false -no-color

      #6️⃣ Terraform Apply
      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve
      - name: Debug Terraform state
        working-directory: terraform
        run: |
         terraform workspace show
         terraform state list
      - name: Inspect Terraform state
        working-directory: terraform
        run: terraform state show aws_s3_bucket.example
